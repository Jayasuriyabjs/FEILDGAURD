
<!DOCTYPE html>
<html>
<head>
    <title>FIELDGUARD Safety System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f3;
            text-align: center;
            padding: 20px;
        }
        h1 { color: #167d55; }
        .card {
            background: white;
            padding: 18px;
            margin: 15px auto;
            max-width: 380px;
            border-radius: 10px;
            box-shadow: 0 2px 6px #ccc;
        }
        button {
            padding: 12px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            background: #167d55;
        }
        .danger { background: #d93025; }
        #status { color: green; font-weight: bold; }
    </style>
</head>
<body>

<h1>🛡️ FIELDGUARD</h1>
<p>Smart Worker Safety System</p>
<button onclick="enableNotifications()">Enable Notifications</button>

<div class="card">
    <h3>System Status</h3>
    <p id="status">SAFE</p>
    <button class="danger" onclick="alertSOS()">🚨 SOS ALERT</button>
    <button onclick="resetSystem()">Reset</button>
</div>

<div class="card">
    <h3>Gas Sensor</h3>
    <p id="gas">Normal (demo)</p>
    <button onclick="gasAlert()">Test Gas Warning</button>
</div>

<div class="card">
    <h3>Motion Detection</h3>
    <p id="motion">Normal (demo)</p>
    <button onclick="fallAlert()">Test Fall Warning</button>
</div>

<div class="card">
    <h3>GPS Location</h3>
    <p>Waiting for GPS connection</p>
</div>

<div class="card">
    <h3>Environment</h3>
    <p>Waiting for sensor connection</p>
</div>

<script>
function enableNotifications() {
    if (!("Notification" in window)) {
        alert("This browser does not support notifications.");
        return;
    }

    Notification.requestPermission().then(permission => {
        if (permission === "granted") {
            notify("FIELDGUARD", "Notifications enabled successfully.");
        } else {
            alert("Notifications were not allowed. Check browser settings.");
        }
    });
}

function notify(title, message) {
    if ("Notification" in window &&
        Notification.permission === "granted") {
        new Notification(title, {
            body: message
        });
    } else {
        alert(title + "\n" + message +
              "\n\nClick Enable Notifications to allow browser notifications.");
    }
}

function alertSOS() {
    document.getElementById("status").innerText = "SOS ACTIVATED!";
    document.getElementById("status").style.color = "red";
    notify("🚨 FIELDGUARD SOS", "Emergency SOS has been activated!");
}

function gasAlert() {
    document.getElementById("gas").innerText = "WARNING!";
    notify("🔥 FIELDGUARD GAS WARNING", "Possible gas danger detected in this demo.");
}

function fallAlert() {
    document.getElementById("motion").innerText = "FALL ALERT!";
    notify("⚠️ FIELDGUARD FALL ALERT", "A possible worker fall was simulated.");
}

function resetSystem() {
    document.getElementById("status").innerText = "SAFE";
    document.getElementById("status").style.color = "green";
    document.getElementById("gas").innerText = "Normal (demo)";
    document.getElementById("motion").innerText = "Normal (demo)";
}
</script>

</body>
</html>
